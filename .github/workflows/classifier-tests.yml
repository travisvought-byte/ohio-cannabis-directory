name: Validate PR classifier
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: classifier-${{ github.ref }}
  cancel-in-progress: true
jobs:
  classifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run classifier tests
        run: python -m unittest discover -s tests -p test_pr_classifier.py -v
      - name: Test maintenance dates and issue queue
        run: python -m unittest discover -s tests -p 'test_automation*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test risk report including Git file modes
        run: node tests/pr-risk-report.cjs
      - name: Validate staged research references
        run: |
          python scripts/validate_pa_research.py
          python -m unittest discover -s tests -p test_research_batch.py -v
