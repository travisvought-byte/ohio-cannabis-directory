name: Validate PR classifier
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  classifier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run classifier tests
        run: python -m unittest discover -s tests -p test_pr_classifier.py -v
