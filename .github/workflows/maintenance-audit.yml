name: Scheduled maintenance audit
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maintenance-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Check canonical data
        run: |
          python tests/check_data.py
          python validate_foundation.py data/directory.json
      - name: Rebuild current-date diagnostic without publishing
        run: python build_review_queue.py --as-of "$(date -u +%F)"
      - name: Report queue drift
        shell: bash
        run: |
          if ! git diff --quiet -- data/review-queue.json architecture/REVIEW_QUEUE.md; then
            echo 'Current-date diagnostic differs from the published release snapshot' >> "$GITHUB_STEP_SUMMARY"
            git diff --stat -- data/review-queue.json architecture/REVIEW_QUEUE.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Current-date diagnostic matches the published snapshot' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: maintenance-review-queue
          path: |
            data/review-queue.json
            architecture/REVIEW_QUEUE.md
          retention-days: 14
