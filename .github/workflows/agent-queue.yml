name: Agent-ready issue queue
on:
  schedule:
    - cron: '37 10 * * 1,4'
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  queue:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Gather issue and PR metadata
        run: |
          gh issue list --state open --label codex --limit 100 --json number,title,url,labels > issues.json
          gh pr list --state open --limit 100 --json number,title,body,url > prs.json
      - name: Build bounded task manifest
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          issues=json.loads(Path('issues.json').read_text())
          prs=json.loads(Path('prs.json').read_text())
          def linked(issue_number):
              pattern=re.compile(r'(?<!\w)#'+str(issue_number)+r'\b')
              return any(pattern.search((p.get('body') or '')+' '+(p.get('title') or '')) for p in prs)
          ready=[{'number':i['number'],'title':i['title'],'url':i['url']}
                 for i in sorted(issues,key=lambda x:x['number']) if not linked(i['number'])]
          selected=ready[:3]
          Path('agent-queue.json').write_text(json.dumps({
              'schema_version':1,'execution_enabled':False,'max_tasks':3,
              'eligible_count':len(ready),'selected':selected
          },indent=2)+'\n')
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Agent-ready issues (read-only)\n\n')
              f.write('No agent was run; no issue was claimed or changed.\n\n')
              for item in selected:
                  f.write(f"- [#{item['number']}]({item['url']}): {item['title']}\n")
              if not selected:f.write('No unclaimed candidates found.\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: agent-queue
          path: agent-queue.json
          retention-days: 14
