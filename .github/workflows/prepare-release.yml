name: Prepare release pull request
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example 4.37)'
        required: true
        type: string
      released_on:
        description: 'Release date YYYY-MM-DD'
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate inputs
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_DATE: ${{ inputs.released_on }}
        run: |
          python - <<'PY'
          import os,re
          from datetime import date
          v=os.environ['VERSION']
          assert re.fullmatch(r'[0-9]+\.[0-9]+',v), 'Invalid release version'
          assert date.fromisoformat(os.environ['RELEASE_DATE']).isoformat()==os.environ['RELEASE_DATE']
          PY
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm ci
      - name: Regenerate release artifacts
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_DATE: ${{ inputs.released_on }}
        run: python release_tools.py "$VERSION" "$RELEASE_DATE"
      - name: Validate release
        run: |
          python tests/check_data.py
          python validate_foundation.py data/directory.json
          python tests/foundation.py
          python tests/migration.py
          python tests/locations.py
          python tests/review_cleanup.py
          npm test
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Create release PR (never merge)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_DATE: ${{ inputs.released_on }}
        run: |
          branch="release/v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          if git diff --cached --quiet; then
            echo 'No release changes to propose' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Prepare v${VERSION} release artifacts"
          gh auth setup-git
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Prepare v${VERSION} release" --body "Release date: ${RELEASE_DATE}. Generated using release_tools.py and validated in the release workflow. Owner approval required. Release notes and CHANGELOG must be reviewed before merging."
