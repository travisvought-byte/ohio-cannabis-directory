name: PR risk assessment (report only)
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: pr-risk-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  assess:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect complete PR file list and regular-file modes
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const number = context.issue.number;
            const pr = (await github.rest.pulls.get({owner,repo,pull_number:number})).data;
            const files = await github.paginate(github.rest.pulls.listFiles, {owner,repo,pull_number:number,per_page:100});
            const allowed = new Set(['docs/README.md','docs/CONTRIBUTING.md']);
            const reasons = [];
            if (pr.state !== 'open') reasons.push('PR is not open');
            if (pr.draft) reasons.push('draft PR');
            if (pr.base.ref !== 'main') reasons.push('unexpected base');
            if (pr.head.repo?.full_name !== owner+'/'+repo) reasons.push('external or unavailable head repository');
            if (files.length === 0 || files.length > 2) reasons.push('file count outside allowlist');
            if (!Number.isInteger(pr.changed_files) || pr.changed_files !== files.length) reasons.push('incomplete changed-file list');
            for (const f of files) {
              if (!allowed.has(f.filename)) reasons.push('blocked path: '+f.filename);
              if (f.status !== 'modified') reasons.push('non-modification: '+f.filename);
              if (f.previous_filename !== undefined && f.previous_filename !== null) reasons.push('rename: '+f.filename);
              if (!Number.isInteger(f.changes) || f.changes < 0 || f.changes > 50) reasons.push('large or unavailable change count: '+f.filename);
              if (typeof f.patch !== 'string' || !f.patch.trim()) reasons.push('diff unavailable: '+f.filename);
            }
            // File-list metadata does not include Git modes. Check both immutable trees
            // before reporting that an otherwise eligible documentation PR is ordinary text.
            if (reasons.length === 0) {
              async function treeAt(commit_sha) {
                const commit = (await github.rest.git.getCommit({owner,repo,commit_sha})).data;
                return (await github.rest.git.getTree({owner,repo,tree_sha:commit.tree.sha,recursive:'true'})).data;
              }
              const [baseTree,headTree] = await Promise.all([treeAt(pr.base.sha),treeAt(pr.head.sha)]);
              if (baseTree.truncated || headTree.truncated) reasons.push('incomplete Git tree metadata');
              const before = new Map(baseTree.tree.map(f=>[f.path,f]));
              const after = new Map(headTree.tree.map(f=>[f.path,f]));
              for (const f of files) {
                const a=before.get(f.filename),b=after.get(f.filename);
                if (a?.mode !== '100644' || a?.type !== 'blob' || b?.mode !== '100644' || b?.type !== 'blob') reasons.push('not an ordinary non-executable file in both trees: '+f.filename);
                if (!b?.sha || b.sha !== f.sha) reasons.push('head changed or blob identity unavailable: '+f.filename);
              }
            }
            const eligible = reasons.length === 0;
            const result = {eligible, reasons, files_inspected:files.length, base_sha:pr.base.sha, head_sha:pr.head.sha};
            const escapeHTML=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
            await core.summary.addHeading('PR risk assessment')
              .addRaw('Classification only: this job never approves or merges PRs.\n\n')
              .addRaw('<pre>'+escapeHTML(JSON.stringify(result,null,2))+'</pre>')
              .write();
            core.info(JSON.stringify(result));
