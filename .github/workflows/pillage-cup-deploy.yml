# Deploys the Silver Cup server (tools/pillage-contest) to Cloudflare: the Worker, its D1 tables and the live-ships room.
# Needs two repository secrets, CLOUDFLARE_API_TOKEN (Workers Scripts: Edit and D1: Edit) and CLOUDFLARE_ACCOUNT_ID.
# Without them it says so and stops, so nothing fails.
name: Silver Cup server deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/pillage-contest/worker.js'
      - 'tools/pillage-contest/wrangler.toml'
      - 'tools/pillage-contest/schema.sql'

permissions:
  contents: read

concurrency:
  group: pillage-cup-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Is there a Cloudflare key?
        id: key
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::The Silver Cup server isn't deployed: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            echo "ok=no" >> "$GITHUB_OUTPUT"
          else
            echo "ok=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.key.outputs.ok == 'yes'
        with:
          node-version: '24'
      - name: Create the tables (safe to repeat)
        if: steps.key.outputs.ok == 'yes'
        working-directory: tools/pillage-contest
        run: npx --yes wrangler@4 d1 execute pillage-contest --remote --file schema.sql
      - name: Deploy the Worker
        if: steps.key.outputs.ok == 'yes'
        working-directory: tools/pillage-contest
        run: |
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://pillage-cup\.[a-z0-9-]+\.workers\.dev' deploy.log | head -1)
          echo "Deployed at: ${url:-see the log}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$url" ]; then curl -fsS "$url/api" >> "$GITHUB_STEP_SUMMARY"; fi
